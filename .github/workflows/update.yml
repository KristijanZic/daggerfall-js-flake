---
name: Update package
on:
  workflow_dispatch:
  schedule:
    # every 15 minutes
    - cron: '*/15 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Run nix-update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix run nixpkgs#nix-update -- \
            --flake \
            --use-github-releases \
            --version-regex 'app-v(.*)' \
            --src-only \
            --system x86_64-linux \
            daggerfall-js
      - name: Commit and push
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          if [[ -n $(git status --porcelain) ]]; then
            git add packages/linux.nix packages/darwin.nix
            git commit -m "daggerfall-js: update to $(grep -oP '(?<=version = ")[^"]+')"
            git push
          else
            echo "No update available"
          fi
